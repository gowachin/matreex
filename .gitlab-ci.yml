image: rocker/tidyverse:${R_VERSION}

variables:
  GIT_DEPTH: 10
  GITHUB_PAT: ${gitpat}
  R_VERSION: "4.4.1"

cache:
  key: global-cache
  paths:
  - ${RENV_PATHS_CACHE}
  - ${RENV_PATHS_LIBRARY}

stages:
  - build
  - test
  - pkgdown
  - deploy

building:
  stage: build
  # rules:
  #   - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apt-get update
    - apt-get install -y texlive-latex-extra
    - apt-get install -y libmagick++-dev libpoppler-cpp-dev qpdf
    - R -e "remotes::install_deps(dependencies = TRUE)"
    - Rscript -e 'remotes::install_cran(c("rcmdcheck"), force = TRUE)'
    - Rscript -e 'remotes::install_local(upgrade = "never", dependencies = TRUE)'
    - echo CI=TRUE >> .Renviron
    - R -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check")'
  artifacts:
    paths:
      - check
    expire_in: 30 days

# To have the coverage percentage appear as a gitlab badge follow these
# instructions:
# https://docs.gitlab.com/ee/user/project/pipelines/settings.html#test-coverage-parsing
# The coverage parsing string is
# Coverage: \d+\.\d+

coverage:
  stage: test
  # rules:
  #   - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  #     when: on_success
  allow_failure: true
  script:
    - Rscript -e 'remotes::install_local(upgrade = "never")'
    - Rscript -e 'remotes::install_cran(c("covr", "DT"), upgrade = "never")'
    - Rscript -e 'covr::gitlab(quiet = FALSE)'
  artifacts:
    paths:
      - public
    expire_in: 30 days

integration:
  stage: pkgdown
  # rules:
  #   - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true
  script:
    - apt-get update
    - apt-get install -y texlive-latex-extra
    - apt-get install -y libmagick++-dev libpoppler-cpp-dev qpdf
    - R -e "remotes::install_deps(dependencies = TRUE)"
    - Rscript -e 'remotes::install_cran("pkgdown", upgrade = "always")'
    - Rscript -e 'remotes::install_local(upgrade = "never", dependencies = TRUE)'
    - Rscript -e 'pkgdown::build_site()'
  artifacts:
    paths:
      - docs
    expire_in: 30 days

pages:
  stage: deploy
  # rules:
  #   - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  dependencies:
    - integration
  script:
    - mkdir -p public
    - cp -r docs/* public
  artifacts:
    paths:
    - public


